name: smartattend
description: "Smart QR-Based Attendance Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (BLoC Mandatory)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Local Database
  sqflite: ^2.4.1
  path: ^1.9.0

  # REST API Integration
  dio: ^5.8.0+1

  # QR Generation and Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # GPS Location & Session Storage
  geolocator: ^13.0.2
  shared_preferences: ^2.3.5

  # Date/Time Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
